[Translations]
$modDisplayName=Player Physics
$modDescription=Движение игрока в духе Quake: явное трение, разгон в воздухе и стрейф в прыжке. Всё, кроме страницы «Патчи кода», применяется через секунду после закрытия меню.

$movement=Движение
$knockbackSlopes=Отбрасывание
$patches=Патчи кода
$patchesPage=Патчи кода

$general=Общее
$ground=На земле
$air=В воздухе
$knockback=Отбрасывание
$slopes=Склоны

$enabled=Включено
$enabledMouse=Главный выключатель. Выключено — движение полностью возвращается движку.

$preset=Пресет
$presetMouse=Какую встроенную настройку использовать. Она заменяет девять значений, которые ниже показаны серым, — чтобы править их вручную, поставьте «Свой». Склоны, поведение при анимациях и патчи кода всегда берутся из ваших настроек, какой бы пресет ни стоял.
$presetCustom=Свой
$presetResponsive=Отзывчивый
$presetGrounded=Сдержанный
$presetHeavy=Тяжёлый

$friction=Трение
$frictionMouse=Насколько сильно земля тормозит, когда вы перестаёте задавать направление. Больше — останавливаетесь быстрее, меньше — скользите.

$acceleration=Ускорение
$accelerationMouse=Насколько сильно земля толкает вас к запрошенной скорости. Больше — резче отклик, меньше — ощущение веса.

$stopSpeed=Скорость остановки
$stopSpeedMouse=Нижняя граница в расчёте трения, чтобы медленное движение затухало, а не ползло бесконечно. Сравнивается с собственной скоростью движка на этот кадр, где уже учтены шаг, присед и нагрузка, — поэтому одно число работает на любом темпе.

$airAcceleration=Ускорение в воздухе
$airAccelerationMouse=Управляемость в прыжке. Именно это делает возможным стрейф в воздухе: больше — больше контроля, 0 — никакого.

$airSpeed=Предел скорости в воздухе
$airSpeedMouse=Множитель прироста скорости за кадр в воздухе. Малые значения не дают стрейфу превратиться в бесплатный разгон.

$gravityMult=Гравитация
$gravityMultMouse=Множитель гравитации только для игрока. Больше — прыжки короче, приземление раньше.

$landingPenalty=Скорость штрафа за приземление
$landingPenaltyMouse=Скорость удара, при которой приземление отнимает половину инерции. Меньше — приземления наказывают сильнее, больше — можно сохранить скорость после большого падения.

$knockbackScale=Сила отбрасывания
$knockbackScaleMouse=Множитель толчков от взрывов и попаданий. 0 — вас не сдвинуть с места.

$knockbackMaxSpeed=Потолок скорости отбрасывания
$knockbackMaxSpeedMouse=Предел скорости в игровых единицах, с которой вас может оставить отбрасывание. Применяется к результату, а не к импульсу, поэтому несколько взрывов подряд не сложатся и не отправят вас на орбиту. Никогда не замедляет ниже той скорости, что уже была. 0 снимает ограничение.

$scaleFrictionBySlope=Масштабировать трение по склону
$scaleFrictionBySlopeMouse=Исходное поведение: ослаблять трение и ускорение на крутой поверхности. Вместе с множителем гравитации это заставляет игрока сползать со склонов и с трудом взбираться, поэтому по умолчанию выключено.

$clipVelocityToSlope=Срезать скорость по склону
$clipVelocityToSlopeMouse=Убирать часть скорости, направленную в поверхность, пока есть опора. Второй, независимый рычаг против сползания. Попробуйте, если сползание остаётся при выключенной настройке выше.

$patchesNote=Применяются при запуске — нужен перезапуск
$allowJumpWhileAiming=Разрешить прыжок при прицеливании
$allowJumpWhileAimingMouse=Снимает запрет на прыжок с поднятым прицелом. Глобально: влияет на всех персонажей, не только на игрока. Вступает в силу при следующем запуске игры.

$keepGroundZVelocity=Сохранять вертикальную скорость на земле
$keepGroundZVelocityMouse=Не даёт наземному состоянию обнулять вертикальную скорость — именно это позволяет прыжку оторваться от земли с заданной скоростью. Глобально; вступает в силу при следующем запуске.

$bunnyhopGroundCollision=Столкновение с землёй при банихопе
$bunnyhopGroundCollisionMouse=Не даёт приземлению съесть следующий за ним прыжок, так что прыжки можно связывать. Глобально; вступает в силу при следующем запуске.
