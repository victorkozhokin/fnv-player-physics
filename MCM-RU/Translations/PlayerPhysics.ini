[Translations]
$modDisplayName=Физика игрока
$modDescription=Полная переработка физики передвижения игрока.

$movement=Движение
$knockbackSlopes=Отбрасывание и склоны
$patches=Патчи кода
$patchesPage=Патчи кода

$general=Общее
$ground=На земле
$air=В воздухе
$knockback=Отбрасывание
$slopes=Склоны

$enabled=Включено
$enabledMouse=Главный выключатель мода. При отключении используется стандартная физика игры.

$preset=Пресет
$presetMouse=Готовая настройка физики. Она автоматически задает основные параметры движения. Чтобы настроить их вручную, выберите «Свой». Настройки склонов, анимаций и патчей кода не зависят от пресета.
$presetCustom=Свой
$presetResponsive=Отзывчивый
$presetGrounded=Сдержанный
$presetHeavy=Тяжелый

$friction=Трение
$frictionMouse=Как быстро вы останавливаетесь, когда перестаете двигаться. Больше — остановка быстрее, меньше — больше скольжения.

$acceleration=Ускорение
$accelerationMouse=Как быстро вы набираете скорость. Больше — движение резче и отзывчивее, меньше — более плавное и тяжелое.

$stopSpeed=Скорость остановки
$stopSpeedMouse=Минимальная скорость, учитываемая при торможении. Помогает небольшим движениям затухать естественно, не создавая долгого скольжения.

$airAcceleration=Ускорение в воздухе
$airAccelerationMouse=Управляемость во время прыжка. Больше — легче менять направление в воздухе, 0 — управление в воздухе отсутствует.

$airSpeed=Предел скорости в воздухе
$airSpeedMouse=Ограничивает дополнительное ускорение при движении в воздухе. Помогает контролировать силу воздушного стрейфа.

$gravityMult=Гравитация
$gravityMultMouse=Сила гравитации для игрока. Больше — прыжки ниже и приземление быстрее, меньше — прыжки выше и дольше.

$landingPenalty=Штраф за приземление
$landingPenaltyMouse=Определяет, сколько скорости теряется при приземлении. Меньше — приземления сильнее замедляют, больше — позволяет лучше сохранять скорость.

$knockbackScale=Сила отбрасывания
$knockbackScaleMouse=Сила толчков от взрывов и попаданий. 0 — отбрасывание полностью отключено.

$knockbackMaxSpeed=Максимальная скорость отбрасывания
$knockbackMaxSpeedMouse=Ограничивает максимальную скорость, которую можно получить от отбрасывания. 0 — без ограничения.

$scaleFrictionBySlope=Учитывать уклон при движении
$scaleFrictionBySlopeMouse=Ослабляет движение на крутых склонах. При включении игроку сложнее подниматься и легче соскальзывать вниз.

$clipVelocityToSlope=Срезать скорость на склонах
$clipVelocityToSlopeMouse=Уменьшает скорость, направленную в поверхность склона. Может дополнительно уменьшить скольжение по крутым поверхностям.

$patchesNote=Применяются при запуске игры. Для изменения требуется перезапуск.

$allowJumpWhileAiming=Разрешить прыжок при прицеливании
$allowJumpWhileAimingMouse=Позволяет прыгать с поднятым прицелом. Влияет на всех персонажей в игре. Для изменения требуется перезапуск.

$keepGroundZVelocity=Сохранять вертикальную скорость на земле
$keepGroundZVelocityMouse=Позволяет сохранять вертикальную скорость при переходе в наземное состояние. Влияет на физику прыжков. Для изменения требуется перезапуск.

$bunnyhopGroundCollision=Сохранять прыжок при приземлении
$bunnyhopGroundCollisionMouse=Позволяет сразу продолжать прыжок после приземления, не теряя момент движения. Для изменения требуется перезапуск.