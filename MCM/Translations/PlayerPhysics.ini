[Translations]
$modDisplayName=Player Physics
$modDescription=Quake-style player movement: explicit friction, air acceleration and air strafing. Everything but the Code Patches page applies within a second of closing this menu.

$movement=Movement
$knockbackSlopes=Knockback
$patches=Code Patches
$patchesPage=Code Patches

$general=General
$ground=On The Ground
$air=In The Air
$knockback=Knockback
$slopes=Slopes

$enabled=Enabled
$enabledMouse=Master switch. Off hands movement back to the engine entirely.

$preset=Preset
$presetMouse=Which built-in tuning to use. It replaces the nine values greyed out below -- set this to Custom to edit them yourself. Slopes, interaction handling and the code patches always come from your own settings whichever preset is chosen.
$presetCustom=Custom
$presetResponsive=Responsive
$presetGrounded=Grounded
$presetHeavy=Heavy

$friction=Friction
$frictionMouse=How hard the ground slows you when you stop steering. Higher stops you sooner; lower slides.

$acceleration=Acceleration
$accelerationMouse=How hard the ground pushes you towards the speed you are asking for. Higher feels snappier, lower feels heavy.

$stopSpeed=Stop Speed
$stopSpeedMouse=Floor under the friction calculation, so slow movement still decays at a usable rate instead of creeping. It is compared against the engine's own speed for this frame, which already accounts for walking, crouching and encumbrance, so one figure works at every pace.

$airAcceleration=Air Acceleration
$airAccelerationMouse=Steering authority in mid-air. This is what makes air strafing work: raise it for more control in the air, drop it to 0 for none.

$airSpeed=Air Speed Cap
$airSpeedMouse=Multiplier on the speed you can gain per frame while airborne. Low values are what keep air strafing from becoming free acceleration.

$gravityMult=Gravity
$gravityMultMouse=Multiplier on gravity for the player only. Higher makes jumps shorter and landings sooner.

$landingPenalty=Landing Penalty Speed
$landingPenaltyMouse=Impact speed at which a landing costs you half your momentum. Lower punishes landings harder; higher lets you keep speed off big drops.

$knockbackScale=Knockback Scale
$knockbackScaleMouse=Multiplier on explosion and impact pushes. 0 leaves you where you stand.

$knockbackMaxSpeed=Knockback Speed Ceiling
$knockbackMaxSpeedMouse=Cap, in game units, on the speed a knockback may leave you with. Applied to the result rather than the impulse, so several blasts at once cannot stack their way into orbit. It never slows you below the speed you already had. 0 removes the limit.

$scaleFrictionBySlope=Scale Friction By Slope
$scaleFrictionBySlopeMouse=The original behaviour: weaken friction and acceleration on steep ground. Combined with the gravity multiplier it makes the player drift down slopes and struggle to climb, which is why it is off by default.

$clipVelocityToSlope=Clip Velocity To Slope
$clipVelocityToSlopeMouse=Remove the part of your velocity heading into the ground plane while supported. A second, independent lever against slope drift. Try it if drift persists with the setting above off.

$patchesNote=Applied At Startup - Restart Required
$allowJumpWhileAiming=Allow Jumping While Aiming
$allowJumpWhileAimingMouse=Removes the block on jumping with the sights up. Global: affects every character, not just the player. Takes effect on the next game start.

$keepGroundZVelocity=Keep Vertical Velocity On Ground
$keepGroundZVelocityMouse=Stops the ground state from wiping vertical velocity, which is what lets a jump leave the ground with the speed it was given. Global; takes effect on the next game start.

$bunnyhopGroundCollision=Bunnyhop Ground Collision
$bunnyhopGroundCollisionMouse=Keeps a landing from eating the jump that follows it immediately, so hops can be chained. Global; takes effect on the next game start.
