[Translations]
$modDisplayName=Player Physics
$modDescription=A complete overhaul of player movement physics.

$movement=Movement
$knockbackSlopes=Knockback & Slopes
$patches=Code Patches
$patchesPage=Code Patches

$general=General
$ground=On the Ground
$air=In the Air
$knockback=Knockback
$slopes=Slopes

$enabled=Enabled
$enabledMouse=Master switch. When disabled, movement is fully handled by the game's standard physics.

$preset=Preset
$presetMouse=Choose a built-in movement setup. It automatically sets the main movement parameters. Choose Custom to adjust them yourself. Slope, animation and code patch settings are not affected by the preset.
$presetCustom=Custom
$presetResponsive=Responsive
$presetGrounded=Grounded
$presetHeavy=Heavy

$friction=Friction
$frictionMouse=How quickly you stop when you stop moving. Higher means a faster stop, lower means more sliding.

$acceleration=Acceleration
$accelerationMouse=How quickly you reach your desired speed. Higher feels more responsive, lower feels smoother and heavier.

$stopSpeed=Stop Speed
$stopSpeedMouse=The minimum speed used when slowing down. Helps small movements come to a natural stop instead of sliding for too long.

$airAcceleration=Air Acceleration
$airAccelerationMouse=How much control you have while jumping. Higher makes it easier to change direction in the air, while 0 disables air control.

$airSpeed=Air Speed Cap
$airSpeedMouse=Limits how much additional speed you can gain while moving through the air. Helps keep air strafing under control.

$gravityMult=Gravity
$gravityMultMouse=Gravity strength for the player. Higher makes jumps shorter and landings faster, while lower makes jumps higher and longer.

$landingPenalty=Landing Penalty Speed
$landingPenaltyMouse=Determines how much speed you lose when landing. Lower makes landings slow you down more, while higher lets you keep more momentum.

$knockbackScale=Knockback Strength
$knockbackScaleMouse=Strength of pushes from explosions and impacts. 0 completely disables knockback.

$knockbackMaxSpeed=Maximum Knockback Speed
$knockbackMaxSpeedMouse=Limits the maximum speed you can reach from knockback. 0 removes the limit.

$scaleFrictionBySlope=Scale Movement By Slope
$scaleFrictionBySlopeMouse=Reduces movement on steep slopes. When enabled, climbing becomes harder and the player is more likely to slide downhill.

$clipVelocityToSlope=Clip Velocity To Slope
$clipVelocityToSlopeMouse=Reduces movement directed into the slope while standing on it. Can further reduce sliding on steep surfaces.

$patchesNote=Applied at game startup. Restart required.

$allowJumpWhileAiming=Allow Jumping While Aiming
$allowJumpWhileAimingMouse=Allows jumping while aiming. Affects all characters in the game. Restart required.

$keepGroundZVelocity=Keep Vertical Velocity on Ground
$keepGroundZVelocityMouse=Preserves vertical velocity when entering the ground state. This affects how jumps behave. Restart required.

$bunnyhopGroundCollision=Bunnyhop Ground Collision
$bunnyhopGroundCollisionMouse=Allows you to immediately jump again after landing without losing your momentum. Restart required.