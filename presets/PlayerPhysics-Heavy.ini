; HEAVY preset
;
; Momentum dominates. You take a moment to get moving, a moment to stop, and
; the direction you were already going keeps a say in where you end up. Air
; control is deliberately weak, so a jump commits you to its arc. Landings hurt.

[Physics]

bEnabled=1

fFriction=3.0
fStopSpeed=5.0
fAcceleration=4.0
fAirAcceleration=0.7
fAirSpeed=0.8
fGravityMult=2.4
fKnockbackScale=7.0
fKnockbackMaxSpeed=750.0
fLandingPenaltyImpactSpeed50=70.0

bVanillaKnockbackDuringInteraction=1
bYieldMovementDuringInteraction=1
bSpecialIdleFallback=1

bScaleFrictionBySlope=0
bClipVelocityToSlope=0

bAllowJumpWhileAiming=1
bKeepGroundZVelocity=1
bBunnyhopGroundCollision=1
