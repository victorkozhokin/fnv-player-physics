; RESPONSIVE preset
;
; The character goes where you point it. Full speed almost immediately, stops
; almost immediately, and strong air control so a jump stays steerable.
; Landings keep most of your momentum, which makes chained hops flow.
; This is what ships as the default configuration.

[Physics]

bEnabled=1

fFriction=8.0
fStopSpeed=11.0
fAcceleration=10.0
fAirAcceleration=1.5
fAirSpeed=1.3
fGravityMult=1.8
fKnockbackScale=12.0
fKnockbackMaxSpeed=1000.0
fLandingPenaltyImpactSpeed50=160.0

bVanillaKnockbackDuringInteraction=1
bYieldMovementDuringInteraction=1
bSpecialIdleFallback=1

bScaleFrictionBySlope=0
bClipVelocityToSlope=0

bAllowJumpWhileAiming=1
bKeepGroundZVelocity=1
bBunnyhopGroundCollision=1
