; GROUNDED preset
;
; Responsive with the edges taken off. A little weight behind starting and
; stopping, slightly less authority in the air, landings that cost a bit more.
; Still quick -- just not frictionless.

[Physics]

bEnabled=1

fFriction=7.0
fStopSpeed=9.5
fAcceleration=8.5
fAirAcceleration=1.35
fAirSpeed=1.2
fGravityMult=1.85
fKnockbackScale=11.0
fKnockbackMaxSpeed=950.0
fLandingPenaltyImpactSpeed50=140.0

bVanillaKnockbackDuringInteraction=1
bYieldMovementDuringInteraction=1
bSpecialIdleFallback=1

bScaleFrictionBySlope=0
bClipVelocityToSlope=0

bAllowJumpWhileAiming=1
bKeepGroundZVelocity=1
bBunnyhopGroundCollision=1
