; Delete this file, or any single line, to fall back to the defaults shown.

[Physics]

; Master switch. 0 leaves the game completely untouched.
bEnabled=1

; Which built-in tuning to use. It replaces the nine values in the two blocks
; below, so editing those does nothing unless this is set to 0.
;
;   0  Custom      -- this file is in charge
;   1  Responsive  -- goes where you point it: full speed at once, stops at
;                     once, strong air control, landings that keep momentum
;   2  Grounded    -- Responsive with the edges taken off. A little weight
;                     behind starting and stopping, slightly less authority in
;                     the air, landings that cost a bit more
;   3  Heavy       -- momentum dominates. Slow to start, slow to stop, a jump
;                     commits you to its arc, landings hurt
;
; Everything outside those nine -- slopes, interaction handling, the code
; patches -- is always read from this file, whichever preset is chosen.
;
; PlayerPhysics.log records which one was applied on every reload.
iPreset=1

fFriction=8.0

; Speed below which friction is applied as if you were moving this fast.
; Prevents an asymptotic crawl to a stop.
;
; Compared against the engine's own speed for this frame, which already accounts
; for walking, crouching, encumbrance and whatever a speed mod has done. One
; absolute figure therefore works at every pace.
fStopSpeed=11.0

; Ground and air acceleration.
fAcceleration=10.0
fAirAcceleration=1.5

; Fraction of your ground speed you may add to per air-strafe tick.
fAirSpeed=1.3

; Gravity multiplier applied while the plugin drives the player.
fGravityMult=1.8

; Knockback (explosions, bullet impacts) strength.
fKnockbackScale=12.0

; Ceiling, in game units, on the speed a knockback may leave you with.
;
; Applied to the result, not to the impulse: two grenades landing together each
; get their own impulse and used to add up without limit. With a ceiling the
; first blast still throws you properly and the rest cannot compound. Whatever
; speed you already carried is never taken away, so this does not cut a bunny
; hop short. 0 removes the limit.
fKnockbackMaxSpeed=1000.0

; Impact speed at which landing costs you half your momentum. Larger is more
; forgiving; 0 disables the landing penalty entirely.
fLandingPenaltyImpactSpeed50=160.0

; Interaction animation mods (B42 Interact and friends) play a special idle and
; then shove the player toward the object every frame. Amplifying that shove is
; what threw the player into orbit, so hand knockback back to the engine for as
; long as such an animation is playing. The mod's approach movement keeps
; working; your own movement physics stay active.
; The three settings below have one correct value each and are deliberately
; absent from the MCM menu. They are here for diagnosis, not for tuning: turning
; the first off launches the player into the air during an interaction
; animation, and turning the second off leaves the plugin fighting the
; animation for control.
bVanillaKnockbackDuringInteraction=1

; Also hand over movement for the duration. The engine roots the player in place
; for these animations and this plugin normally suppresses that rooting, so
; without this the player is still being fought over. Turn off only if you want
; to keep moving freely during interaction animations.
bYieldMovementDuringInteraction=1

; Treat any special idle as an interaction when nothing has said otherwise.
;
; This is the old behaviour and it is blunt: the engine can report that a
; special idle is playing but not whose, nor whether that mod is moving the
; player or merely animating him. So it stands the physics down for every
; animation mod in the load order.
;
; It is not consulted at all once the bundled script has announced itself, which
; it does at load. With the script layer installed the physics stand down only
; while an interaction mod is actually pulling the player, and never for anyone
; else's animations.
;
; Leave it on. It costs nothing while the script is there, and it is what keeps
; interaction mods working if the script ever goes missing.
bSpecialIdleFallback=1

; --- Slopes ------------------------------------------------------------------

; Scale ground friction and acceleration by the slope's steepness, as the
; original did.
;
; The scale is the ground normal's Z: 1 on the flat, shrinking as the ground
; steepens. That means grip was weakest exactly where the slope pulls hardest,
; and with fGravityMult at 2.0 the result is drifting down hills and struggling
; to climb rocks. Off by default now. Set to 1 for the original behaviour.
bScaleFrictionBySlope=0

; Remove the velocity component heading into the ground while standing on it.
;
; Vanilla MoveCharacter solves movement in a coordinate frame built from the
; slope; this plugin replaces it wholesale and does not, so that component has
; nothing taking it back out. Try switching this on if you still slide after
; turning the setting above off.
bClipVelocityToSlope=0

bAllowJumpWhileAiming=1

; Keep vertical velocity on the ground when no movement key is held.
bKeepGroundZVelocity=1

; Use plain ground collision (ignoring input and speed percentage), which is
; what makes consecutive bunny hops land reliably.
bBunnyhopGroundCollision=1
